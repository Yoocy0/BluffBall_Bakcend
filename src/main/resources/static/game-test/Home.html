<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluffBall</title>
    <link rel="stylesheet" href="/game-test/css/game-test.css">
</head>
<body class="home-body">
<div class="home-page">

    <!-- 로그인 전 -->
    <section id="loginScreen" class="home-screen">
        <h1 class="home-title">BluffBall</h1>
        <p class="home-subtitle">소셜 로그인 후 게임을 시작하세요</p>

        <div class="home-login-actions">
            <button type="button" id="btnKakaoLogin" class="home-login-btn home-login-kakao">
                카카오로 로그인
            </button>
            <button type="button" id="btnGoogleLogin" class="home-login-btn home-login-google">
                구글로 로그인
            </button>
        </div>

        <p id="loginError" class="home-error" hidden></p>
    </section>

    <!-- 로그인 후 — 모드 선택 -->
    <section id="homeScreen" class="home-screen" hidden>
        <h1 class="home-title">BluffBall</h1>
        <p id="userInfo" class="home-user-info"></p>

        <div class="home-mode-list">
            <button type="button" id="btnModeSingle" class="home-mode-btn">싱글 모드</button>
            <button type="button" id="btnModeClanMini" class="home-mode-btn home-mode-btn-disabled" disabled>
                클랜전 (미니 모드)
            </button>
            <button type="button" id="btnModeClanRegular" class="home-mode-btn home-mode-btn-disabled" disabled>
                클랜전 (정규 모드)
            </button>
            <button type="button" id="btnModeCustom" class="home-mode-btn home-mode-btn-disabled" disabled>
                커스텀 모드
            </button>
        </div>

        <button type="button" id="btnLogout" class="home-logout-btn">로그아웃</button>
        <p id="homeError" class="home-error" hidden></p>
    </section>

    <!-- 싱글 모드 매칭 대기 -->
    <section id="matchingScreen" class="home-screen" hidden>
        <h1 class="home-title home-title-sm">BluffBall</h1>
        <p class="matching-status-label">매칭 중...</p>
        <p id="matchingTimer" class="matching-timer">00:00</p>
        <p class="matching-hint">상대방을 찾고 있습니다</p>
        <button type="button" id="btnCancelMatch" class="home-mode-btn home-mode-btn-cancel">매칭 취소</button>
        <p id="matchingError" class="home-error" hidden></p>
    </section>

</div>

<!-- 매칭 완료 팝업 -->
<div id="matchCompleteModal" class="match-modal" hidden>
    <div class="match-modal-card">
        <p class="match-modal-title">매칭이 완료되었습니다!</p>
        <p id="matchCompleteCountdown" class="match-modal-countdown">3</p>
        <p class="match-modal-sub">잠시 후 게임으로 이동합니다</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/game-test/js/auth.js?v=1"></script>
<script src="/game-test/js/ws-client.js?v=1"></script>
<script src="/game-test/js/game-role.js?v=1"></script>
<script src="/game-test/js/game-ws.js?v=2"></script>
<script src="/game-test/js/home.js?v=6"></script>
</body>
</html>
