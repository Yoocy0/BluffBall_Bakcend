<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluffBall</title>
    <link rel="stylesheet" href="/game-test/css/game-test.css?v=6">
</head>
<body class="home-body">
<div class="home-page">

    <!-- 로그인 전 -->
    <section id="loginScreen" class="home-screen">
        <h1 class="home-title">BluffBall</h1>
        <p class="home-subtitle">소셜 로그인 후 게임을 시작하세요</p>

        <div class="home-login-actions">
            <button type="button" id="btnKakaoLogin" class="home-login-btn home-login-kakao">
                카카오로 로그인
            </button>
            <button type="button" id="btnGoogleLogin" class="home-login-btn home-login-google">
                구글로 로그인
            </button>

            <div class="home-dev-login">
                <p class="home-dev-login-label">개발자 테스트 로그인</p>
                <div class="home-dev-login-row">
                    <input type="password"
                           id="devPinInput"
                           class="home-dev-pin-input"
                           inputmode="numeric"
                           pattern="[0-9]*"
                           maxlength="4"
                           placeholder="4자리 PIN"
                           autocomplete="one-time-code">
                    <button type="button" id="btnDevLogin" class="home-login-btn home-login-dev">
                        로그인
                    </button>
                </div>
            </div>
        </div>

        <p id="loginError" class="home-error" hidden></p>
    </section>

    <!-- 로그인 후 — 허브 -->
    <section id="hubScreen" class="home-screen" hidden>
        <h1 class="home-title">BluffBall</h1>
        <p id="userInfo" class="home-user-info"></p>

        <div class="home-mode-list">
            <button type="button" id="btnOpenGameStart" class="home-mode-btn">게임 시작</button>
            <button type="button" id="btnOpenTeam" class="home-mode-btn home-mode-btn-alt">팀</button>
            <button type="button" id="btnOpenPitchCards" class="home-mode-btn home-mode-btn-alt">구종 카드</button>
        </div>

        <button type="button" id="btnLogout" class="home-logout-btn">로그아웃</button>
        <p id="hubError" class="home-error" hidden></p>
    </section>

    <!-- 모드 선택 -->
    <section id="homeScreen" class="home-screen" hidden>
        <h1 class="home-title home-title-sm">게임 시작</h1>
        <p class="home-subtitle">모드를 선택하세요</p>

        <div class="home-mode-list">
            <button type="button" id="btnModeShowdown" class="home-mode-btn">쇼다운</button>
            <button type="button" id="btnModeBotShowdown" class="home-mode-btn home-mode-btn-alt">
                봇전 (쇼다운)
            </button>
            <button type="button" id="btnModeLeagueCompact" class="home-mode-btn">리그 (컴팩트)</button>
            <button type="button" id="btnModeLeagueFull" class="home-mode-btn">리그 (풀)</button>
            <button type="button" id="btnModeBotCompact" class="home-mode-btn home-mode-btn-alt">
                컴팩트 · 상대 봇
            </button>
            <button type="button" id="btnModeBotFull" class="home-mode-btn home-mode-btn-alt">
                풀 · 상대 봇
            </button>
            <button type="button" id="btnBackToHub" class="home-mode-btn home-mode-btn-cancel">뒤로</button>
        </div>

        <p id="homeError" class="home-error" hidden></p>
    </section>

    <!-- 봇전 난이도 선택 -->
    <section id="botDifficultyScreen" class="home-screen" hidden>
        <h1 class="home-title home-title-sm">봇전 (쇼다운)</h1>
        <p class="home-subtitle">난이도를 선택하세요</p>

        <div class="home-mode-list">
            <button type="button" id="btnBotDiffEasy" class="home-mode-btn home-diff-btn"
                    data-difficulty="EASY">
                쉬움
                <span class="home-diff-desc">튜토리얼 기본 덱</span>
            </button>
            <button type="button" id="btnBotDiffNormal" class="home-mode-btn home-diff-btn"
                    data-difficulty="NORMAL">
                보통
                <span class="home-diff-desc">마스터 기본 구종</span>
            </button>
            <button type="button" id="btnBotDiffHard" class="home-mode-btn home-diff-btn"
                    data-difficulty="HARD">
                어려움
                <span class="home-diff-desc">강화 카드 포함</span>
            </button>
            <button type="button" id="btnBackToModes" class="home-mode-btn home-mode-btn-cancel">뒤로</button>
        </div>

        <p id="botDiffError" class="home-error" hidden></p>
    </section>

    <!-- 매칭 대기 -->
    <section id="matchingScreen" class="home-screen" hidden>
        <h1 class="home-title home-title-sm">BluffBall</h1>
        <p id="matchingModeLabel" class="matching-status-label">매칭 중...</p>
        <p id="matchingTimer" class="matching-timer">00:00</p>
        <p class="matching-hint">상대방을 찾고 있습니다</p>
        <button type="button" id="btnCancelMatch" class="home-mode-btn home-mode-btn-cancel">매칭 취소</button>
        <p id="matchingError" class="home-error" hidden></p>
    </section>

</div>

<!-- 매칭 완료 팝업 -->
<div id="matchCompleteModal" class="match-modal" hidden>
    <div class="match-modal-card">
        <p class="match-modal-title">매칭이 완료되었습니다!</p>
        <p id="matchCompleteCountdown" class="match-modal-countdown">3</p>
        <p class="match-modal-sub">잠시 후 게임으로 이동합니다</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/game-test/js/auth.js?v=2"></script>
<script src="/game-test/js/ws-client.js?v=1"></script>
<script src="/game-test/js/game-role.js?v=3"></script>
<script src="/game-test/js/game-ws.js?v=11"></script>
<script src="/game-test/js/game-nav.js?v=11"></script>
<script src="/game-test/js/home.js?v=14"></script>
</body>
</html>
