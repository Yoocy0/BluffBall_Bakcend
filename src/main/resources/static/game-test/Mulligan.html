<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluffBall — 멀리건 (카드 교체)</title>
    <link rel="stylesheet" href="/game-test/css/game-test.css">
</head>
<body>
<div class="page">
    <h1>멀리건 — 구종 카드</h1>
    <p class="subtitle">초기 드로우 3장 · WebSocket cards/mulligan</p>
    <p class="nav-row"><a class="nav-link" href="/game-test/SetupNumber.html">← 숫자 선택으로</a></p>

    <section class="panel">
        <div class="row">
            <span id="mulliganStatus" class="status disconnected">대기</span>
        </div>
        <p id="handStatus" class="phase-desc">CardHandEvent 패를 불러옵니다.</p>
    </section>

    <section class="panel" id="swapResultPanel" hidden>
        <h2>교체 결과</h2>
        <div id="swapResultList" class="swap-result-list"></div>
    </section>

    <section class="panel" id="mulliganWaitPanel" hidden>
        <p class="phase-desc">내 멀리건 완료 — 상대방 멀리건을 기다리는 중…</p>
    </section>

    <section class="panel">
        <h2>구종 카드 (3장)</h2>
        <p class="phase-desc">교체할 카드를 클릭해 선택하세요. (복수 선택 가능)</p>
        <div id="pitchHand" class="card-grid"></div>
        <div class="actions">
            <button type="button" id="btnSwap" class="secondary" disabled>교체</button>
            <button type="button" id="btnConfirm" class="primary" disabled>확정</button>
        </div>
    </section>

    <section class="panel">
        <h2>로그</h2>
        <div id="log" class="log"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/game-test/js/auth.js?v=1"></script>
<script src="/game-test/js/ws-client.js?v=1"></script>
<script src="/game-test/js/game-role.js?v=3"></script>
<script src="/game-test/js/game-ws.js?v=6"></script>
<script src="/game-test/js/game-nav.js?v=2"></script>
<script src="/game-test/js/mulligan.js?v=8"></script>
</body>
</html>
