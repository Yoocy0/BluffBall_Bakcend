<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluffBall — 투수 좌표</title>
    <link rel="stylesheet" href="/game-test/css/game-test.css?v=5">
</head>
<body class="play-body">
<div id="setupNumbersHud" class="setup-numbers-hud" hidden></div>
<div id="broadcastHud" class="broadcast-hud"></div>
<main class="play-main">
    <p class="play-phase-title">PITCH · 시작 좌표</p>
    <section class="pitch-selected-summary" id="selectedPitchSummary"></section>
    <p class="coord-legend">녹색 = 스트라이크 존 · 타자에게 공개되는 시작 위치</p>
    <div id="coordGrid" class="coord-grid"></div>
    <section id="waitPanel" class="panel wait-panel" hidden>
        <p class="phase-desc">타자 선택 대기 중… TurnResultEvent를 기다립니다.</p>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<script src="/game-test/js/game-role.js?v=3"></script>
<script src="/game-test/js/game-ws.js?v=12"></script>
<script src="/game-test/js/card-catalog.js?v=1"></script>
<script src="/game-test/js/game-nav.js?v=10"></script>
<script src="/game-test/js/pitcher-sub.js?v=1"></script>
