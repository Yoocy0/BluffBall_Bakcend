<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluffBall — 투수 구종·좌표 선택</title>
    <link rel="stylesheet" href="/game-test/css/game-test.css">
</head>
<body>
<div class="page">
    <h1>투수 — 구종 &amp; 시작 좌표</h1>
    <p class="subtitle">구종 + 시작 좌표 · 이닝 진행 시 타자 선택으로 바로 이동 (loop=1)</p>
    <p class="nav-row"><a class="nav-link" href="/game-test/Mulligan.html" id="linkMulligan">← 멀리건으로</a></p>

    <section class="panel">
        <h2>매치</h2>
        <div class="row">
            <input type="text" id="matchSessionId" placeholder="matchSessionId (UUID)">
            <button type="button" id="btnPrepare" class="secondary">게임 준비</button>
        </div>
        <p id="gameStatus" class="phase-desc">-</p>
        <p id="prepareStatus" class="phase-desc">게임 준비 시 패·좌표 로드</p>
    </section>

    <section class="panel">
        <h2>1. 구종 카드 선택</h2>
        <div id="pitchHand" class="card-grid"></div>
    </section>

    <section class="panel">
        <h2>2. 시작 좌표 선택</h2>
        <p class="coord-legend">녹색 칸 = 스트라이크 존 · 숫자는 타자에게 공개되는 시작 좌표</p>
        <div id="coordGrid" class="coord-grid"></div>
    </section>

    <section class="panel">
        <div class="actions">
            <button type="button" id="btnSubmit" class="primary" disabled>투구 제출</button>
        </div>
    </section>

    <section class="panel">
        <h2>로그</h2>
        <div id="log" class="log"></div>
    </section>
</div>

<script src="/game-test/js/pitcher-select.js?v=2"></script>
</body>
</html>
