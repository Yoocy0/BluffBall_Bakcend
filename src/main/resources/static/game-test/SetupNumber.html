<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluffBall — 숫자 선택</title>
    <link rel="stylesheet" href="/game-test/css/game-test.css">
</head>
<body>
<div class="page">
    <h1>블러핑 숫자 선택</h1>
    <p class="subtitle">아웃 5 → 병살 1 → 3루타 1 → 홈런 1</p>
    <p id="matchSessionLabel" class="subtitle version-tag"></p>
    <p id="setupStatus" class="subtitle">WebSocket 연결 중...</p>

    <section class="panel">
        <h2>숫자 선택</h2>
        <p id="phaseTitle" class="phase-title">아웃 번호 (0/5)</p>
        <p id="phaseDesc" class="phase-desc">5개 선택 (1~12)</p>
        <div id="numberGrid" class="number-grid"></div>
        <dl class="selection-summary">
            <div><dt>아웃:</dt><dd id="summaryOut">-</dd></div>
            <div><dt>병살:</dt><dd id="summaryDp">-</dd></div>
            <div><dt>3루타:</dt><dd id="summaryTriple">-</dd></div>
            <div><dt>홈런:</dt><dd id="summaryHr">-</dd></div>
        </dl>
        <div class="actions">
            <button type="button" id="btnReset" class="secondary">선택 초기화</button>
            <button type="button" id="btnSubmit" class="primary" disabled>제출</button>
        </div>
    </section>

    <section class="panel">
        <h2>로그</h2>
        <div id="log" class="log"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/game-test/js/auth.js?v=1"></script>
<script src="/game-test/js/ws-client.js?v=1"></script>
<script src="/game-test/js/game-role.js?v=2"></script>
<script src="/game-test/js/game-ws.js?v=6"></script>
<script src="/game-test/js/game-nav.js?v=3"></script>
<script src="/game-test/js/setup-number.js?v=12"></script>
</body>
</html>
