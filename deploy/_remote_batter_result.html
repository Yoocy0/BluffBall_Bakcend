<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluffBall — 타격 결과</title>
    <link rel="stylesheet" href="/game-test/css/game-test.css">
</head>
<body class="play-body turn-result-page">
<div id="setupNumbersHud" class="setup-numbers-hud" hidden></div>
<div id="broadcastHud" class="broadcast-hud"></div>

<div id="diceRollOverlay" class="dice-roll-overlay" hidden>
    <p class="dice-roll-label">타격!</p>
    <div id="diceStage" class="dice-stage"></div>
    <p class="dice-roll-hint">주사위 굴리는 중…</p>
</div>

<div id="resultCard" class="turn-result-card" hidden>
    <p class="turn-result-label">PLAY RESULT</p>
    <p id="turnResult" class="turn-result-value">-</p>
    <p id="resultDetail" class="turn-result-detail"></p>
    <p id="pitchTypeLine" class="turn-result-pitch-type"></p>
    <p id="countdown" class="turn-result-countdown"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/game-test/js/auth.js?v=1"></script>
<script src="/game-test/js/ws-client.js?v=1"></script>
<script src="/game-test/js/game-role.js?v=3"></script>
<script src="/game-test/js/game-ws.js?v=8"></script>
<script src="/game-test/js/game-nav.js?v=6"></script>
<script src="/game-test/js/batter-result.js?v=11"></script>
</body>
</html>
